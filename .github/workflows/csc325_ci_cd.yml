name: CSC325 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Match local Python; installed Django requires Python >= 3.12.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        env:
          VERIFY_PYTHON: python
        run: bash verify.sh

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tutorial deployment placeholder
        run: |
          echo "### Deployment not configured" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests passed" >> "$GITHUB_STEP_SUMMARY"
